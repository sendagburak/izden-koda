name: İlk sürümleri yayımla

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: izden-koda-first-publish

jobs:
  publish:
    if: github.repository == 'sendagburak/izden-koda' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Doğrulanmış yayın arşivini al
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/izden-koda"
          mkdir -p "$stage"
          asset_id="$(gh api --paginate "repos/$GH_REPO/releases" --jq '
            .[] | select(.draft and .name == "İzden Koda · Yayın aktarımı") |
            .assets[] | select(.name == "Izden_Koda_Yayin_Aktarimi.zip" and .state == "uploaded") | .id
          ')"
          [[ "$asset_id" =~ ^[0-9]+$ ]]
          gh api -H 'Accept: application/octet-stream' "repos/$GH_REPO/releases/assets/$asset_id" > "$stage/payload.zip"
          echo 'bc99b8fc6244fed18fbb32aa4e3c63ce74be7cd3dc5b426185ab56709ffe50ce  payload.zip' |
            (cd "$stage" && sha256sum -c)
          unzip -q "$stage/payload.zip" -d "$stage"
          for version_assets in "$stage"/releases/v*; do
            (cd "$version_assets" && sha256sum -c SHA256SUMS.txt)
          done

      - name: Kaynak geçmişiyle altı etiketi birlikte gönder
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/izden-koda"
          git clone --branch main --no-tags "https://github.com/$GH_REPO.git" "$stage/repo"
          cd "$stage/repo"
          tags=(v0.1 v0.5 v0.6 v0.7.0 v0.8.0 v0.8.1)
          refs=()
          refspecs=()
          for tag in "${tags[@]}"; do
            refs+=("refs/tags/$tag")
            refspecs+=("refs/tags/$tag:refs/tags/$tag")
          done
          git bundle verify "$stage/Izden_Koda_Kaynak.bundle"
          git fetch "$stage/Izden_Koda_Kaynak.bundle" refs/heads/main:refs/heads/source-publication "${refspecs[@]}"
          if ! git merge-base --is-ancestor source-publication HEAD; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --allow-unrelated-histories --no-ff --no-commit -s ours source-publication
            git read-tree --reset -u source-publication
            git checkout HEAD -- .github/workflows/first-publish.yml
            git commit -m 'İzden Koda kaynak geçmişini ve sürüm sayfasını yayımla'
            git diff --exit-code source-publication HEAD -- . ':!.github/workflows/first-publish.yml'
          fi
          gh auth setup-git --hostname github.com
          git push --atomic origin HEAD:refs/heads/main "${refs[@]}"
          git ls-remote --heads --tags origin

      - name: Sürüm dosyalarını yükle ve yayınla
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/izden-koda"
          manifest="$stage/manifest.json"
          mapfile -t tags < <(jq -r '.[].tag' "$manifest")

          get_releases() {
            gh api --paginate "repos/$GH_REPO/releases" | jq -s 'add // []'
          }

          releases="$(get_releases)"
          for tag in "${tags[@]}"; do
            release="$(jq -c --arg tag "$tag" '.[] | select(.tag_name == $tag)' <<< "$releases")"
            if [[ -z "$release" ]]; then
              title="$(jq -r --arg tag "$tag" '.[] | select(.tag == $tag) | .title' "$manifest")"
              options=()
              if [[ "$(jq -r --arg tag "$tag" '.[] | select(.tag == $tag) | .prerelease' "$manifest")" == true ]]; then
                options+=(--prerelease)
              fi
              gh release create "$tag" --draft --verify-tag --title "$title" --notes-file "$stage/notes-$tag.md" "${options[@]}"
              release='{"draft":true,"assets":[]}'
            fi
            if [[ "$(jq -r '.draft' <<< "$release")" == true ]]; then
              missing=()
              while IFS= read -r filename; do
                if ! jq -e --arg filename "$filename" '.assets | any(.name == $filename)' <<< "$release" >/dev/null; then
                  missing+=("$stage/releases/$tag/$filename")
                fi
              done < <(jq -r --arg tag "$tag" '.[] | select(.tag == $tag) | .files[].name' "$manifest")
              if (( ${#missing[@]} )); then
                gh release upload "$tag" "${missing[@]}"
              fi
            fi
          done

          releases="$(get_releases)"
          for tag in "${tags[@]}"; do
            jq -e --arg tag "$tag" --slurpfile manifest "$manifest" '
              (first($manifest[0][] | select(.tag == $tag))) as $expected |
              (first(.[] | select(.tag_name == $tag))) as $found |
              ($found.name == $expected.title) and
              ($found.prerelease == $expected.prerelease) and
              (($found.assets | length) == ($expected.files | length)) and
              all($expected.files[];
                . as $item | any($found.assets[];
                  .name == $item.name and .size == $item.size and .state == "uploaded" and
                  ((.digest // "") == "" or .digest == ("sha256:" + $item.sha256))
                )
              )
            ' <<< "$releases" >/dev/null
            echo "$tag asset manifest verified"
          done

          for tag in "${tags[@]}"; do
            if jq -e --arg tag "$tag" '.[] | select(.tag_name == $tag) | .draft' <<< "$releases" >/dev/null; then
              if [[ "$tag" == v0.8.1 ]]; then
                gh release edit "$tag" --draft=false --latest --verify-tag
              else
                gh release edit "$tag" --draft=false --latest=false --verify-tag
              fi
            fi
          done
          get_releases | jq -r '.[] | select(.draft | not) | [.tag_name, (.assets | length), .html_url] | @tsv'
